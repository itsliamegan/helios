name: Check

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: "Check out repository"
        uses: actions/checkout@v4

      - name: "Install uv"
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: "Install"
        run: uv sync --locked

      - name: "Lint"
        run: |
          uv run ruff format --check
          uv run ruff check

      - name: "Type check"
        run: uv run ty check

      - name: "Test"
        run: uv run -m luna.test.runner
