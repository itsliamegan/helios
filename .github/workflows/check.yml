name: Check

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: "Check out repository"
        uses: actions/checkout@v7

      - name: "Install uv"
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: "Install Node"
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: "Install"
        run: |
          uv sync --locked
          npm ci --prefix packages/assets

      - name: "Lint"
        run: |
          uv run ruff format --check
          uv run ruff check

      - name: "Type check"
        run: uv run ty check

      - name: "Test"
        run: |
          for member in packages/*/; do
            (cd "$member" && uv run luna test)
          done
