[dependency-groups]
dev = [
	"ruff>=0.17.1",
	"ty>=0.0.89",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
target-version = "py314"

[tool.ruff.format]
indent-style = "tab"
nested-string-quote-style = "preferred"
quote-style = "double"

[tool.ruff.lint]
extend-select = [
	"D200",
	"D205",
	"D209",
	"D212",
]
ignore = [
	"BLE001",
	"G010",
	"RUF012",
]

[tool.ruff.lint.isort]
case-sensitive = true
known-first-party = ["helios"]
force-sort-within-sections = true
order-by-type = false
