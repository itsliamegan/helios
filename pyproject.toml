[project]
name = "helios"
version = "0.1"
requires-python = ">=3.14"
dependencies = [
	"jinja2==3.1.*",
	"python-dotenv>=1.2.2",
	"werkzeug==3.1.*",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"

[tool.ruff.format]
indent-style = "tab"
nested-string-quote-style = "preferred"
quote-style = "double"

[tool.ruff.lint]
ignore = [
	"BLE001",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
	"helios.view.Attributes",
	"helios.view.attributes.Attributes",
	"markupsafe.Markup",
]

[tool.ruff.lint.isort]
case-sensitive = true
known-first-party = ["helios"]
force-sort-within-sections = true
order-by-type = false

[tool.uv.sources]
luna = { path = "../luna", editable = true }

[dependency-groups]
dev = [
	"luna",
	"ruff>=0.16.6",
	"time-machine>=3.5.1",
	"ty>=0.0.80",
]
