[project]
name = "helios-url"
version = "0.1"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
	"luna",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.sources]
luna = { git = "https://github.com/itsliamegan/luna", branch = "main" }

[tool.uv.build-backend]
module-name = "helios.url"
namespace = true
