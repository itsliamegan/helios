[project]
name = "helios"
version = "0.1"
requires-python = ">=3.14"
dependencies = [
	"helios-assets",
	"helios-url",
	"helios-view",
	"luna",
	"python-dotenv>=1.2.2",
	"watchfiles==1.3.*",
	"werkzeug==3.1.*",
]

[dependency-groups]
dev = [
	"time-machine>=3.5.1",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.sources]
helios-assets = { workspace = true }
helios-url = { workspace = true }
helios-view = { workspace = true }
luna = { git = "https://github.com/itsliamegan/luna", branch = "main" }

[tool.uv.build-backend]
module-name = "helios"
namespace = true
