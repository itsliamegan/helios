[project]
name = "helios-assets"
version = "0.1"
requires-python = ">=3.14"
dependencies = [
	"markupsafe==3.0.*",
]

[dependency-groups]
dev = [
	"helios",
	"luna",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.sources]
helios = { workspace = true }
luna = { workspace = true }

[tool.uv.build-backend]
module-name = "helios.assets"
